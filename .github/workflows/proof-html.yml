name: Proof HTML
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v2 also runs the W3C HTML validator (check_html) in addition to the link checks
      - uses: anishathalye/proof-html@v2.2.5
        with:
          directory: ./
