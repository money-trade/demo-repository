name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      # v1 ran on deprecated Node 16/20 and did not know numOfAssignee, so the run failed
      uses: pozil/auto-assign-issue@v4.1.0
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Chiraphinyo001
          numOfAssignee: 1
          # do not fail the workflow if the user cannot be assigned (e.g. not a collaborator)
          allowNoAssignees: true
